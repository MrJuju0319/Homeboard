name: CI

on:
  push:
    branches: [beta, stable]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Syntaxe PHP
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null || { echo "ERREUR $f"; fail=1; }
          done < <(find . -name '*.php' -not -path './.git/*')
          exit $fail

      - name: Syntaxe JavaScript
        run: |
          node --check desktop/js/homeboard.js
          node --check pwa/sw.js

      - name: info.json valide
        run: |
          php -r '
            $d = json_decode(file_get_contents("plugin_info/info.json"), true);
            if (!is_array($d)) { fwrite(STDERR, "info.json illisible\n"); exit(1); }
            foreach (["id", "name", "version", "author"] as $k) {
              if (empty($d[$k])) { fwrite(STDERR, "info.json : champ manquant " . $k . "\n"); exit(1); }
            }
            echo "info.json ", $d["id"], " ", $d["version"], "\n";
          '

      - name: Aucun secret ni adresse personnelle dans le code
        run: |
          # Le plugin est public : aucune IP LAN, aucun domaine personnel,
          # aucun identifiant ni clé ne doit se retrouver dans le code livré.
          if grep -rnE '192\.168\.[0-9]+\.[0-9]+|bellier|jeedom\.link|BEGIN [A-Z ]*PRIVATE KEY|password[[:space:]]*=[[:space:]]*.\w' \
              --include='*.php' --include='*.js' --include='*.css' --include='*.json' \
              --exclude-dir=.git . ; then
            echo "::error::Adresse, identifiant ou clé détecté dans le code"
            exit 1
          fi
          echo "Aucun motif sensible"

      - name: Tests de logique pure
        run: php tests/run.php --pure

  # Les contrôles qui touchent à la base et à l'API Jeedom (droits, pièces
  # masquées, scénarios) demandent une instance Jeedom : ils s'exécutent sur
  # l'hôte Jeedom avec `php plugins/homeboard/tests/run.php`.
