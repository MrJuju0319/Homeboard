# Homeboard — CSP dédiée au dossier PWA du plugin.
#
# La CSP globale de Jeedom (/etc/apache2/conf-available/security.conf) déclare
#   worker-src blob:
# sans 'self' : un service worker servi depuis une URL est interdit, donc la PWA
# ne peut pas s'enregistrer (pas de cache, pas d'installation réelle).
#
# Installation :
#   cp homeboard-pwa.conf /etc/apache2/conf-available/
#   a2enconf homeboard-pwa && apache2ctl configtest && systemctl reload apache2
#
# Retour en arrière :
#   a2disconf homeboard-pwa && systemctl reload apache2
#
# Portée : uniquement /plugins/homeboard/pwa/. Le reste de Jeedom conserve la
# CSP d'origine (vérifié sur index.php après activation).
#
# Politique volontairement stricte : aucun script ni style inline, pas
# d'eval, pas d'objet ni de formulaire externe. Les scripts sont dans
# desktop/js (chargé via getResource.php) et les styles dans desktop/css ;
# la page pwa/index.php ne contient plus rien d'inline.

<Directory /var/www/html/plugins/homeboard/pwa>
	<IfModule mod_headers.c>
		# On retire la CSP globale pour ce dossier seulement, puis on la remplace
		# (sinon deux en-têtes sont envoyés et le navigateur applique l'intersection,
		# donc l'ancienne règle worker-src resterait bloquante).
		Header unset Content-Security-Policy
		Header always unset Content-Security-Policy
		Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'"
	</IfModule>
</Directory>
